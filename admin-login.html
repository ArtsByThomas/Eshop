<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení do Administrace</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); width: 100%; max-width: 400px; }
        .auth-card h1 { text-align: center; margin-top: 0; color: #111; margin-bottom: 30px; font-weight: 800; letter-spacing: -0.5px; }
        .auth-card h1 span { color: #d32f2f; font-size: 16px; vertical-align: middle; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #111; }
        .btn { width: 100%; padding: 12px; background: #d32f2f; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #b71c1c; }
        #error-msg { color: #d32f2f; text-align: center; font-size: 14px; margin-top: 15px; display: none; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h1>ESHOP. <span>ADMIN</span></h1>
        <form id="admin-login-form">
            <div class="form-group">
                <label for="username">Jméno</label>
                <input type="text" id="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn">Vstoupit do administrace</button>
            <div id="error-msg"></div>
        </form>
    </div>

    <script>
        document.getElementById('admin-login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('error-msg');
            
            try {
                const response = await fetch('admin-auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    window.location.href = 'admin.html';
                } else {
                    errorMsg.style.display = 'block';
                    errorMsg.textContent = result.message;
                }
            } catch (error) {
                console.error("Chyba:", error);
            }
        });
    </script>
</body>
</html>
