<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderní E-shop</title>
    <link rel="stylesheet" href="css/index.css">
    <script src="js/index.js" defer></script>
</head>
<body>

    <nav>
        <div class="brand-logo">ESHOP.</div>

        <div class="search-container">
            <input type="text" id="search-input" placeholder="Hledat produkt..." autocomplete="off">
        </div>

        <ul style="display: flex; align-items: center; gap: 20px;">
            <li id="active-orders" style="position: relative; display: none; align-items: center; cursor: pointer;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="16.5" y1="9.4" x2="7.5" y2="4.21"></line>
                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                </svg>
                <span id="active-orders-badge" class="cart-badge" style="display: none; background: #d32f2f;">0</span>
                
                <div class="dropdown" id="active-orders-dropdown" style="width: 320px; padding: 20px; cursor: default;">
                    <h3 style="margin: 0 0 15px 0; font-size: 16px; color: #111; border-bottom: 1px solid #eee; padding-bottom: 10px;">Aktivní objednávky</h3>
                    <div id="active-orders-content" class="active-orders-scroll">
                        <p style="color: #777; font-size: 14px; text-align: center; margin: 10px 0;">Načítám data...</p>
                    </div>
                </div>
            </li>

            <!-- Stávající košík -->
            <li id="user-shop" style="position: relative;">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path stroke="none" d="M0 0h24v24H0z" fill="none"/><path d="M6.331 8h11.339a2 2 0 0 1 1.977 2.304l-1.255 8.152a3 3 0 0 1 -2.966 2.544h-6.852a3 3 0 0 1 -2.965 -2.544l-1.255 -8.152a2 2 0 0 1 1.977 -2.304" /><path d="M9 11v-5a3 3 0 0 1 6 0v5" /></svg>
                <span id="cart-badge" class="cart-badge">0</span>
                <div class="dropdown" id="user-shop-dropdown"></div>
            </li>
            
            <!-- Stávající profil -->
            <li id="user-profile" style="position: relative; display: flex; align-items: center; gap: 8px; cursor: pointer;">
                <svg id="profile-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                    <path d="M8 7a4 4 0 1 0 8 0a4 4 0 0 0 -8 0" />
                    <path d="M6 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" />
                </svg>
                <span id="profile-text" style="font-weight: 500; font-size: 15px;"></span>
                <ul class="dropdown" id="user-profile-dropdown"></ul>
            </li>
        </ul>
    </nav>

    <div class="filters-wrapper" id="filters-container"></div>
    <main id="items"></main>
    <footer>Vytvořeno s ❤️ od Tomáše Valenty</footer>

    <div id="product-modal" class="modal-overlay">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            
            <div class="modal-gallery">
                <img id="modal-img" src="" alt="">
                <div class="gallery-dots" id="gallery-dots"></div>
            </div>
            
            <div class="modal-details">
                <h2 id="modal-title">Název</h2>
                <div id="modal-price" class="price">0 Kč</div>
                <p id="modal-desc">Popis produktu...</p>
                <div id="modal-colors" class="color-options"></div>
                <button id="modal-add-btn" class="add-to-cart-btn">Přidat do košíku</button>
            </div>
        </div>
    </div>
    
</body>
</html>
