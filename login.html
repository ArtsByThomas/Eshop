<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Přihlášení</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f9f9f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .auth-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 400px; }
        .auth-card h1 { text-align: center; margin-top: 0; color: #111; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #333; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #111; }
        .btn { width: 100%; padding: 12px; background: #111; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #333; }
        .links { text-align: center; margin-top: 20px; font-size: 14px; color: #666; }
        .links a { color: #111; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
        .back-link { display: block; text-align: center; margin-bottom: 20px; text-decoration: none; color: #777; font-size: 14px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <a href="index.html" class="back-link">← Zpět na e-shop</a>
        <h1>Přihlášení</h1>
        <form id="login-form">
            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" placeholder="vas@email.cz" required>
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn">Přihlásit se</button>
        </form>
      <div class="links">
            <a href="zapomenute-heslo.html" style="display: block; margin-bottom: 15px; color: #666; font-weight: normal;">Zapomněli jste heslo?</a>
            Nemáte ještě účet? <a href="register.html">Zaregistrujte se</a>
        </div>
    </div>

 <script>
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            try {
                // Pošleme přihlašovací údaje na ověření do auth.php
                const response = await fetch('auth.php?action=login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    // Pokud MongoDB ověří hash hesla, přihlásíme uživatele v prohlížeči
                    localStorage.setItem('isLoggedIn', 'true');
                    localStorage.setItem('userId', result.user_id);
                    window.location.href = 'index.html';
                } else {
                    // Špatné heslo nebo e-mail
                    alert("Chyba: " + result.message);
                }
            } catch (error) {
                console.error("Chyba při přihlášení:", error);
                alert("Kritická chyba při komunikaci se serverem.");
            }
        });
    </script>
</body>
</html>
