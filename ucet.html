<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Účet</title>
    <link rel="stylesheet" href="css/ucet.css">
    <script src="js/ucet.js" defer></script>
</head>
<body>

    <div class="account-card">
        <h1>Nastavení profilu</h1>
        
        <form id="checkoutForm">
            <div class="form-group">
                <label for="name">Jméno a příjmení</label>
                <input type="text" id="name" required>
            </div>

            <div class="form-group">
                <label for="street">Ulice a číslo popisné</label>
                <input type="text" id="street" required>
            </div>

            <div class="flex-row">
                <div class="form-group" style="flex: 0.5;">
                    <label for="zip">PSČ</label>
                    <input type="text" id="zip" required>
                </div>
                <div class="form-group">
                    <label for="city">Město</label>
                    <input type="text" id="city" required>
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Telefonní číslo</label>
                <input type="tel" id="phone" required>
            </div>

            <div class="form-group">
                <label for="email">Kontaktní e-mail</label>
                <input type="email" id="email" required>
            </div>

            <div style="margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px;">
                <button type="button" id="show-password-btn" onclick="togglePasswordSection()" style="background: none; border: none; color: #111; font-weight: 600; font-size: 15px; cursor: pointer; padding: 0; text-decoration: underline;">
                    Změnit heslo
                </button>
            </div>

            <div id="password-section" style="display: none; margin-top: 20px;">
                <div class="flex-row">
                    <div class="form-group" style="flex: 1;">
                        <label for="old-password">Současné heslo</label>
                        <div style="position: relative;">
                            <input type="password" id="old-password" style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                            <!-- Ikona: PŘEŠKRTNUTÉ OKO (výchozí) -->
                            <span onclick="toggleVisibility('old-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; display: flex;" title="Zobrazit heslo">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </span>
                        </div>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label for="new-password">Nové heslo (min. 8 znaků)</label>
                        <div style="position: relative;">
                            <input type="password" id="new-password" minlength="8" style="width: 100%; padding-right: 40px; box-sizing: border-box;">
                            <!-- Ikona: PŘEŠKRTNUTÉ OKO (výchozí) -->
                            <span onclick="toggleVisibility('new-password', this)" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; display: flex;" title="Zobrazit heslo">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            </span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="button-group" style="margin-top: 25px;">
                <button type="button" id="back-button" onclick="history.back()">Zpět</button>
                <button type="submit" id="submit-button">Uložit změny</button>
            </div>
        </form>
        
        <hr style="margin: 30px 0; border: none; border-top: 1px solid #eee;">
        
        <h2>Historie objednávek</h2>
        <div id="orders-history-container" style="margin-top: 15px;">
            <p style="color: #666;">Načítám historii...</p>
        </div>
    </div>

</body>
</html>
